# Standalone deployment. On BigBox, install LLMCoach from BoxPilot's app catalog instead.
#
# CPU-only:             docker compose up -d --build
# NVIDIA GPU installed: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Expects an Ollama server on the host at port 11434 (e.g. BoxPilot's Ollama app).
services:
  llmcoach:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${LLMCOACH_PORT:-8420}:8000"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
